<!doctype html>
<html><head><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Special+Elite&amp;family=Titan+One&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Special+Elite&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.hud{text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 0 #000,3px 3px 0 #000}
button{font-family:inherit}
</style>
</head><body style="margin:0"><div id="out">

<div style="width: 360px; height: 430px; padding: 14px; background: #0b1012; font-family: 'Barlow Condensed', sans-serif; color: #e9f0ed">

<!-- One chat message: a Leverage pool roll -->
<div style="background: linear-gradient(165deg, #27363f 0%, #0b1012 100%); border: 3px solid #000; border-radius: 6px; box-shadow: 4px 4px 0 rgba(0,0,0,.5); overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #000">
<span style="width: 34px; height: 40px; flex: none; background: #d9d6ca; border: 2px solid #d8c24a; background-image: repeating-linear-gradient(180deg, transparent 0 7px, rgba(0,0,0,.2) 7px 8px)"></span>
<span style="flex: 1; min-width: 0; line-height: 1.05"><span class="hud" style="display: block; font-family: 'Anton', sans-serif; font-size: 20px; letter-spacing: .04em; color: #fff">ROSA DELGADO</span><span style="display: block; font-size: 13px; color: #9fb2ad">cracks the office safe</span></span>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px 0">

<span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 1px 7px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); color: #e9f0ed; background: rgba(255,255,255,.06)">AGILITY <span style="color: #4ba3f5">d10</span></span>

<span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 1px 7px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); color: #e9f0ed; background: rgba(255,255,255,.06)">THIEF <span style="color: #4ba3f5">d10</span></span>

<span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 1px 7px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); color: #e9f0ed; background: rgba(255,255,255,.06)">SAFECRACKING <span style="color: #f2a03d">d6</span></span>

<span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 1px 7px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); color: #e9f0ed; background: rgba(255,255,255,.06)">OLD DOCKS LOYALTY <span style="color: #4fbf6b">d8</span></span>

</div>

<div style="display: flex; justify-content: center; gap: 8px; padding: 14px 10px 6px">

<span style="display: flex; flex-direction: column; align-items: center; gap: 3px">
<span title="AGILITY · d10 rolled 9" style="position: relative; width: 50px; height: 50px; flex: none; opacity: 1"><svg viewBox="0 0 100 100" width="50" height="50" aria-hidden="true" style="position: absolute; left: 0; top: 0"><polygon points="50,8 92,38 77,92 23,92 8,38" fill="#4ba3f5" stroke="#f2efe4" stroke-width="7" stroke-linejoin="round"></polygon></svg><span style="position: absolute; left: 0; right: 0; top: 15px; text-align: center; line-height: 1; font-family: 'Anton', sans-serif; font-size: 20px; color: #10150f">9</span></span>
<span style="font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #f2efe4">KEPT</span>
</span>

<span style="display: flex; flex-direction: column; align-items: center; gap: 3px">
<span title="THIEF · d10 rolled 6" style="position: relative; width: 50px; height: 50px; flex: none; opacity: 1"><svg viewBox="0 0 100 100" width="50" height="50" aria-hidden="true" style="position: absolute; left: 0; top: 0"><polygon points="50,8 92,38 77,92 23,92 8,38" fill="#4ba3f5" stroke="#f2efe4" stroke-width="7" stroke-linejoin="round"></polygon></svg><span style="position: absolute; left: 0; right: 0; top: 15px; text-align: center; line-height: 1; font-family: 'Anton', sans-serif; font-size: 20px; color: #10150f">6</span></span>
<span style="font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #f2efe4">KEPT</span>
</span>

<span style="display: flex; flex-direction: column; align-items: center; gap: 3px">
<span title="SAFECRACKING · d6 rolled 1" style="position: relative; width: 50px; height: 50px; flex: none; opacity: 0.75"><svg viewBox="0 0 100 100" width="50" height="50" aria-hidden="true" style="position: absolute; left: 0; top: 0"><polygon points="14,14 86,14 86,86 14,86" fill="#f2a03d" stroke="#ee5a5a" stroke-width="7" stroke-linejoin="round"></polygon></svg><span style="position: absolute; left: 0; right: 0; top: 12px; text-align: center; line-height: 1; font-family: 'Anton', sans-serif; font-size: 24px; color: #10150f">1</span></span>
<span style="font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #ee8a8a">1 · OUT</span>
</span>

<span style="display: flex; flex-direction: column; align-items: center; gap: 3px">
<span title="OLD DOCKS LOYALTY · d8 rolled 5" style="position: relative; width: 50px; height: 50px; flex: none; opacity: 0.45"><svg viewBox="0 0 100 100" width="50" height="50" aria-hidden="true" style="position: absolute; left: 0; top: 0"><polygon points="50,8 92,50 50,92 8,50" fill="#4fbf6b" stroke="#4fbf6b" stroke-width="4" stroke-linejoin="round"></polygon></svg><span style="position: absolute; left: 0; right: 0; top: 12px; text-align: center; line-height: 1; font-family: 'Anton', sans-serif; font-size: 24px; color: #10150f">5</span></span>
<span style="font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #6f7f7b">d8</span>
</span>

</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 10px 12px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: .12em; color: #9fb2ad">TOTAL</span>
<span class="hud" style="font-family: 'Anton', sans-serif; font-size: 48px; line-height: 1; color: #fff">15</span>
<span style="font-size: 13px; line-height: 1.15; color: #9fb2ad">2 highest kept
9 + 6</span>
</div>

<div style="display: flex; align-items: center; gap: 8px; margin: 0 10px 10px; padding: 7px 10px; border: 2px dashed #ee5a5a; border-radius: 4px; background: rgba(238,90,90,.08)">
<span style="font-family: 'Anton', sans-serif; font-size: 18px; color: #ee5a5a">1</span>
<span style="flex: 1; font-size: 14px; line-height: 1.15; color: #f2c7c7">One die came up 1. The Fixer may add a Complication and hand you a Plot Point.</span>
</div>

<div style="display: flex; gap: 6px; padding: 0 10px 10px">
<button type="button" title="Spend a Plot Point to add the next highest die to the total" style="flex: 1; height: 34px; background: #d8c24a; color: #10150f; border: 2px solid #000; border-radius: 4px; font-size: 14px; font-weight: 700; letter-spacing: .08em; cursor: pointer">+1 PP · KEEP 3RD DIE</button>
<button type="button" title="GM: create or step up a Complication and give 1 Plot Point" style="flex: 1; height: 34px; background: transparent; color: #ee8a8a; border: 2px solid #ee8a8a; border-radius: 4px; font-size: 14px; font-weight: 700; letter-spacing: .08em; cursor: pointer">GM · COMPLICATION</button>
</div>

</div>
</div>
</div>

</body></html>
