</head><body style="margin:0"><div id="out">

<div style="position: absolute; left: 20px; bottom: 16px; max-width: 520px; font-size: 14px; line-height: 1.3; color: #9fb2ad">The HUD keeps a fixed 16px gap from the sidebar. Collapse the sidebar and it slides right with it. Stars: only the GM can click. Money: left click +1 step, right click −1 step.</div>

<!-- Foundry sidebar stand-in -->
<div style="position: absolute; top: 0; right: 0; bottom: 0; width: 300px; background: rgba(8,12,14,.94); border-left: 2px solid #000; display: flex; flex-direction: column">

<span style="width: 26px; height: 26px; flex: none; border-radius: 4px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15)"></span>

<span style="width: 26px; height: 26px; flex: none; border-radius: 4px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15)"></span>

<span style="height: 44px; border-radius: 4px; background: rgba(255,255,255,.05)"></span>
<span style="height: 60px; border-radius: 4px; background: rgba(255,255,255,.05)"></span>
<span style="height: 36px; border-radius: 4px; background: rgba(255,255,255,.05)"></span>
<span style="font-size: 12px; letter-spacing: .12em; color: #5f6f6c; text-align: center">CHAT · ACTORS · JOURNAL …</span>

<span class="hud" style="font-family: 'Anton', sans-serif; font-size: 40px; line-height: 1; color: #4fa346; margin-right: 4px">$</span>

</button>

<div style="display: flex; align-items: center; gap: 6px" title="Plot Points">

<button type="button" aria-label="Gain a Plot Point" style="width: 22px; height: 22px; padding: 0; background: #000; color: #fff; border: 2px solid #fff; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="margin-left: 4px"><circle cx="12" cy="12" r="10" fill="#d8c24a" stroke="#000" stroke-width="2"></circle><circle cx="12" cy="12" r="6" fill="none" stroke="#000" stroke-width="1.6" stroke-dasharray="3 2.2"></circle></svg>
