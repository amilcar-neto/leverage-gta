<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player HUD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.hud{text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 0 #000,3px 3px 0 #000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1180px; height: 380px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 40% 30%, #3a4a50 0%, #141b1e 75%); border: 4px solid #000; border-radius: 8px; font-family: 'Barlow Condensed', sans-serif; color: #e9f0ed">

<!-- faint scene grid, stands in for the Foundry canvas -->
<div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 50px 50px"></div>
<div style="position: absolute; left: 20px; top: 16px; font-size: 14px; font-weight: 600; letter-spacing: .14em; color: #9fb2ad">FOUNDRY CANVAS · TOP RIGHT · SIDEBAR {{sidebar.label}}</div>
<div style="position: absolute; left: 20px; bottom: 16px; max-width: 520px; font-size: 14px; line-height: 1.3; color: #9fb2ad">The HUD keeps a fixed 16px gap from the sidebar. Collapse the sidebar and it slides right with it. Stars: only the GM can click. Money: left click +1 step, right click −1 step.</div>

<!-- Foundry sidebar stand-in -->
<div style="position: absolute; top: 0; right: 0; bottom: 0; width: {{sidebar.w}}; background: rgba(8,12,14,.94); border-left: 2px solid #000; display: flex; flex-direction: {{sidebar.dir}}">
<div style="display: flex; flex-direction: {{sidebar.tabDir}}; gap: 4px; padding: 6px; border-bottom: 1px solid rgba(255,255,255,.08)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
<span style="width: 26px; height: 26px; flex: none; border-radius: 4px; background: {{t.bg}}; border: 1px solid rgba(255,255,255,.15)"></span>
</sc-for>
</div>
<div style="display: {{sidebar.chatDisplay}}; flex: 1; padding: 10px; flex-direction: column; gap: 8px">
<span style="height: 44px; border-radius: 4px; background: rgba(255,255,255,.05)"></span>
<span style="height: 60px; border-radius: 4px; background: rgba(255,255,255,.05)"></span>
<span style="height: 36px; border-radius: 4px; background: rgba(255,255,255,.05)"></span>
<span style="font-size: 12px; letter-spacing: .12em; color: #5f6f6c; text-align: center">CHAT · ACTORS · JOURNAL …</span>
</div>
</div>

<!-- GTA III style HUD: wanted stars, money, Plot Points. Right-aligned, anchored to the sidebar. -->
<div style="position: absolute; top: 14px; right: {{sidebar.gap}}; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">

<div style="display: flex; gap: 1px" title="Wanted level · {{city}} · GM only">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
<button type="button" title="{{s.tip}}" style="position: relative; width: 50px; height: 50px; padding: 0; background: none; border: 0; cursor: pointer; opacity: {{s.op}}">
<svg viewBox="0 0 24 24" width="50" height="50" aria-hidden="true" style="position: absolute; left: 0; top: 0"><path d="M12 1.8l3.1 6.4 7 .9-5.1 4.9 1.3 7L12 17.6 5.7 21l1.3-7L1.9 9.1l7-.9z" fill="{{s.fill}}" stroke="#000" stroke-width="1.5" stroke-linejoin="round"></path></svg>
<span style="position: absolute; left: 0; right: 0; top: 20px; text-align: center; line-height: 1; font-family: 'Anton', sans-serif; font-size: 13px; letter-spacing: .02em; color: {{s.ink}}">{{s.label}}</span>
</button>
</sc-for>
</div>

<button type="button" title="Grana · level {{money.level}}. Left click +1 step, right click −1 step." style="display: flex; align-items: center; gap: 4px; padding: 0; background: none; border: 0; cursor: pointer">
<span class="hud" style="font-family: 'Anton', sans-serif; font-size: 40px; line-height: 1; color: #4fa346; margin-right: 4px">$</span>
<sc-for list="{{money.dice}}" as="m" hint-placeholder-count="2">
<span style="position: relative; width: 38px; height: 38px; flex: none; opacity: {{m.op}}"><svg viewBox="0 0 100 100" width="38" height="38" aria-hidden="true" style="position: absolute; left: 0; top: 0"><polygon points="{{m.outer}}" fill="{{m.fill}}" stroke="#000" stroke-width="7" stroke-linejoin="round" stroke-dasharray="{{m.dash}}"></polygon></svg><span style="position: absolute; left: 0; right: 0; top: {{m.top}}; text-align: center; line-height: 1; font-family: 'Anton', sans-serif; font-size: {{m.fpx}}; color: #e2f7d9">{{m.n}}</span></span>
</sc-for>
</button>

<div style="display: flex; align-items: center; gap: 6px" title="Plot Points">
<button type="button" aria-label="Spend a Plot Point" style="width: 22px; height: 22px; padding: 0; background: #000; color: #fff; border: 2px solid #fff; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<button type="button" aria-label="Gain a Plot Point" style="width: 22px; height: 22px; padding: 0; background: #000; color: #fff; border: 2px solid #fff; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="margin-left: 4px"><circle cx="12" cy="12" r="10" fill="#d8c24a" stroke="#000" stroke-width="2"></circle><circle cx="12" cy="12" r="6" fill="none" stroke="#000" stroke-width="1.6" stroke-dasharray="3 2.2"></circle></svg>
<span class="hud" style="min-width: 30px; text-align: right; font-family: 'Anton', sans-serif; font-size: 34px; line-height: 1; color: #d8c24a">{{pp}}</span>
</div>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stars":{"editor":"range","default":2,"min":0,"max":5,"step":1,"section":"State"},"money":{"editor":"range","default":7,"min":0,"max":25,"step":1,"section":"State"},"pp":{"editor":"range","default":3,"min":0,"max":9,"step":1,"section":"State"},"sidebar":{"editor":"select","options":["open","collapsed"],"default":"open","section":"State"},"$preview":{"width":1180,"height":380}}'>
class Component extends DCLogic {
  renderVals() {
    const GEOM = {
      4: { outer: '50,10 92,86 8,86', top: '17px', fpx: '15px' },
      6: { outer: '14,14 86,14 86,86 14,86', top: '10px', fpx: '18px' },
      8: { outer: '50,8 92,50 50,92 8,50', top: '10px', fpx: '18px' },
      10: { outer: '50,8 92,38 77,92 23,92 8,38', top: '12px', fpx: '15px' },
      12: { outer: '50,8 89,30 89,70 50,92 11,70 11,30', top: '12px', fpx: '15px' }
    };
    const SIZE = [null, 4, 6, 8, 10, 12];

    // Wanted level. Each star shows the police die it brings; the GM edits these per city
    // in the system settings. Liberty City: star die + d6 (4 stars: d12+d12, 5: d12+d12+d8).
    const LIBERTY = [['d8', 'd8 + d6'], ['d10', 'd10 + d6'], ['d12', 'd12 + d6'], ['d12', 'd12 + d12'], ['d12', 'd12 + d12 + d8']];
    const lit = Math.max(0, Math.min(5, this.props.stars ?? 2));
    const stars = LIBERTY.map(([label, pool], i) => {
      const on = i < lit;
      return {
        label, op: on ? 1 : 0.8,
        fill: on ? '#ffcf1f' : '#3b3313',
        ink: on ? '#1d1500' : '#857232',
        tip: (i + 1) + ' star' + (i ? 's' : '') + ' · police roll ' + pool + (on ? '' : ' (not active)')
      };
    });

    // Money: one number of steps. Every full d12 is 5 steps; the leftmost die holds the rest.
    // Biggest die on the right, new dice appear on the left.
    const level = Math.max(0, Math.min(25, this.props.money ?? 7));
    const full = Math.floor(level / 5), rest = level % 5;
    const sizes = (rest ? [SIZE[rest]] : []).concat(Array(full).fill(12));
    const money = {
      level,
      dice: sizes.length
        ? sizes.map((n) => ({ n, ...GEOM[n], fill: '#2f7a34', dash: 'none', op: 1 }))
        : [{ n: '0', ...GEOM[4], fill: 'transparent', dash: '10 8', op: 0.6 }]
    };

    const open = (this.props.sidebar ?? 'open') === 'open';
    const sidebar = open
      ? { w: '300px', gap: '316px', label: 'OPEN', dir: 'column', tabDir: 'row', chatDisplay: 'flex' }
      : { w: '40px', gap: '56px', label: 'COLLAPSED', dir: 'column', tabDir: 'column', chatDisplay: 'none' };
    const tabs = [0, 1, 2, 3, 4, 5, 6].map((i) => ({ bg: i === 0 ? 'rgba(216,194,74,.5)' : 'rgba(255,255,255,.06)' }));

    return { city: 'LIBERTY CITY', stars, money, pp: String(this.props.pp ?? 3), sidebar, tabs };
  }
}
</script>
</body>
</html>
