<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Talent · item sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.hud{text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 0 #000,3px 3px 0 #000}
button{font-family:inherit}
.field{width:100%;resize:none;background:rgba(255,255,255,.05);color:#e9f0ed;border:2px solid rgba(0,0,0,.7);border-radius:4px;padding:8px 10px;font-family:'Barlow Condensed',sans-serif;font-size:16px;line-height:1.3}
.field:focus{outline:none;border-color:#f2efe4}
.lbl{font-size:12px;font-weight:700;letter-spacing:.14em;color:#7fc2b4;margin-bottom:4px}
</style>
</helmet>
<div style="width: 520px; height: 520px; display: flex; flex-direction: column; background: linear-gradient(165deg, #27363f 0%, #0b1012 100%); border: 4px solid #000; border-radius: 8px; overflow: hidden; font-family: 'Barlow Condensed', sans-serif; color: #e9f0ed">

<!-- Foundry window title bar -->
<div style="height: 32px; flex: none; background: #000; display: flex; align-items: center; gap: 10px; padding: 0 12px">
<span style="font-size: 15px; font-weight: 700; letter-spacing: .06em; color: #9fb2ad">TALENT</span>
<span style="font-size: 15px; font-weight: 700; letter-spacing: .06em">· Rosa Delgado</span>
<span style="flex: 1"></span>
<button type="button" aria-label="Close" style="width: 22px; height: 22px; padding: 0; background: transparent; color: #e9f0ed; border: 1px solid #9fb2ad; border-radius: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
</div>

<div style="height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #d8c24a; border-bottom: 3px solid #000">
<input value="{{t.name}}" aria-label="Talent name" class="hud" style="flex: 1; min-width: 0; background: transparent; border: 0; padding: 0; font-family: 'Anton', sans-serif; font-size: 28px; letter-spacing: .04em; color: #fff">
</div>

<div style="flex: 1; min-height: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; gap: 12px">
<div style="flex: 1">
<div class="lbl">ROLE</div>
<button type="button" title="The Role this Talent belongs to, or Open" style="width: 100%; height: 34px; padding: 0 10px; display: flex; align-items: center; background: rgba(255,255,255,.05); color: #e9f0ed; border: 2px solid rgba(0,0,0,.7); border-radius: 4px; font-size: 17px; font-weight: 700; letter-spacing: .08em; cursor: pointer">{{t.role}}<span style="margin-left: auto; color: #9fb2ad">▾</span></button>
</div>
<div style="flex: 1">
<div class="lbl">COST</div>
<div style="display: flex; height: 34px; border: 2px solid #000; border-radius: 4px; overflow: hidden">
<button type="button" aria-pressed="{{t.free}}" style="flex: 1; padding: 0; background: {{t.freeBg}}; color: {{t.freeInk}}; border: 0; font-size: 15px; font-weight: 700; letter-spacing: .08em; cursor: pointer">FREE</button>
<button type="button" aria-pressed="{{t.pp}}" style="flex: 1; padding: 0; background: {{t.ppBg}}; color: {{t.ppInk}}; border: 0; border-left: 2px solid #000; font-size: 15px; font-weight: 700; letter-spacing: .08em; cursor: pointer">1 PLOT POINT</button>
</div>
</div>
</div>

<div>
<div class="lbl">ACTIVATION · WHEN IT TRIGGERS</div>
<textarea class="field" rows="2" aria-label="Activation">{{t.act}}</textarea>
</div>

<div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
<div class="lbl">EFFECT · WHAT IT DOES</div>
<textarea class="field" style="flex: 1" aria-label="Effect">{{t.eff}}</textarea>
</div>

<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 13px; color: #9fb2ad">Changes save as you type.</span>
<span style="flex: 1"></span>
<button type="button" style="height: 30px; padding: 0 12px; background: transparent; color: #ff8a8a; border: 2px solid #ff8a8a; border-radius: 4px; font-size: 14px; font-weight: 700; letter-spacing: .1em; cursor: pointer">DELETE TALENT</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const pp = true;
    return {
      t: {
        name: 'WHEELMAN’S NERVE',
        role: 'OPEN',
        act: 'You are behind the wheel during a chase. Spend a Plot Point.',
        eff: 'Reroll any of your dice that came up 1. Keep the new results, even if they are lower. If a reroll comes up 1 again, it still counts for Complications.',
        pp, free: !pp,
        ppBg: pp ? '#d8c24a' : 'rgba(255,255,255,.05)', ppInk: pp ? '#10150f' : '#9fb2ad',
        freeBg: pp ? 'rgba(255,255,255,.05)' : '#d8c24a', freeInk: pp ? '#9fb2ad' : '#10150f'
      }
    };
  }
}
</script>
</body>
</html>
